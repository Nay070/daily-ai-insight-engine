[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "daily-ai-insight"
version = "0.1.0"
description = "A reproducible, evidence-grounded daily AI news insight pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.13,<2.14",
  "pyyaml>=6.0,<6.1",
]

[project.optional-dependencies]
ai = [
  "pydantic-ai-slim[openai]>=2.27,<2.28",
]
report = [
  "jinja2>=3.1,<3.2",
]
dev = [
  "pytest>=8.4,<8.5",
  "ruff>=0.16,<0.17",
]

[project.scripts]
daily-ai-insight = "daily_ai_insight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_ai_insight"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
filterwarnings = [
  "ignore:There is no current event loop:DeprecationWarning:pydantic_graph._utils",
]
